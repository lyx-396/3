version: '3.9'
services:
  web:
    build: .
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=sqlite:///auto.db
      - ADMIN_USER=\${ADMIN_USER:-admin}
      - ADMIN_PASS=\${ADMIN_PASS:-changeme}
    ports:
      - "8080:8080"
    volumes:
      - ./auto.db:/app/auto.db
      - ./uploads:/app/uploads
      - ./exports:/app/exports
